plugins:
  rubocop-rails

AllCops:
  TargetRubyVersion: 3.4
  TargetRailsVersion: 8.1
  SuggestExtensions: false

  Exclude:
    - '**/vendor/**/*'

  NewCops: enable

# Rules for CustomWorkflows
Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Rails/HasAndBelongsToMany:
  Enabled: false

Rails/SkipsModelValidations:
  Exclude:
    - db/migrate/20210210144000_change_default_active_boolean_value_to_custom_workflows.rb
    # Tests store scripts without the syntax check, which runs them
    - test/**/*

# The after_save/after_destroy callbacks return the result of the workflows, but Rails ignores it. Renaming them or
# turning a false result into `throw :abort` (3.1.0) made a failing after_* script an HTTP 500.
Naming/PredicateMethod:
  Exclude:
    - lib/redmine_custom_workflows/patches/models/*_patch.rb

Style/ExpandPathArguments:
  Enabled: false

Style/HashSyntax:
  EnforcedShorthandSyntax: either
